[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmhs-varenrich"
version = "0.1.0"
description = "Privacy-first rare-variant, disease, and pathway enrichment for human genomics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Human Genomics Solutions"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
varenrich = "varenrich.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11"]
standalone = ["pyinstaller>=6.16,<7"]
release = ["build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/varenrich"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
