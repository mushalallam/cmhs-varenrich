name: Standalone builds

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --outdir release-assets
      - run: python packaging/checksum_files.py release-assets/*.whl release-assets/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: CMHS-VarEnrich-Python
          path: release-assets/*
          if-no-files-found: error
      - name: Attach files to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macOS-Apple-Silicon
            executable: dist/varenrich
            format: zip
          - runner: macos-15-intel
            label: macOS-Intel
            executable: dist/varenrich
            format: zip
          - runner: ubuntu-22.04
            label: Linux-x86_64
            executable: dist/varenrich
            format: tar.gz
          - runner: windows-2025
            label: Windows-x86_64
            executable: dist/varenrich.exe
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[standalone]'
      - run: pyinstaller --clean --noconfirm --onefile --paths src --name varenrich packaging/varenrich_entry.py
      - run: python packaging/smoke_standalone.py "${{ matrix.executable }}" --version 0.1.0
      - run: >-
          python packaging/package_standalone.py
          --binary "${{ matrix.executable }}"
          --platform-label "${{ matrix.label }}"
          --version 0.1.0
          --format "${{ matrix.format }}"
      - uses: actions/upload-artifact@v7
        with:
          name: CMHS-VarEnrich-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
      - name: Attach files to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release-assets/* --clobber
