name: Independent statistical validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scipy-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . scipy
      - run: python scripts/validate_against_scipy.py
